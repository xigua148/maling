# pre-commit 钩子配置
# 安装: pip install pre-commit && pre-commit install
# 手动运行: pre-commit run --all-files
#
# v1.4.8 新增

repos:
  # 通用文件检查（行尾空白、YAML 语法、大文件等）
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: debug-statements

  # Ruff: 代码检查 + 格式化（替代 flake8/isort/black）
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.8
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # pytest 快速检查（仅本地，CI 中由 GitHub Actions 覆盖）
  - repo: local
    hooks:
      - id: pytest-quick
        name: pytest (quick)
        entry: python -m pytest tests/ -x -q --tb=line
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
