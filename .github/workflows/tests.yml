# CI/CD: 码铃 MaLing 自动化测试流水线
name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt || true
          pip install -r requirements_gui.txt || true

      - name: Syntax check all Python files
        run: |
          python -c "
          import py_compile, pathlib, sys
          errors = []
          for f in pathlib.Path('.').rglob('*.py'):
              if '.venv' in str(f) or 'build' in str(f) or 'dist' in str(f):
                  continue
              try:
                  py_compile.compile(str(f), doraise=True)
              except py_compile.PyCompileError as e:
                  errors.append(str(e))
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('All files compile OK')
          "

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run tests with coverage
        run: |
          pip install pytest-cov || true
          python -m pytest tests/ --cov=. --cov-report=term-missing --cov-report=html || true
